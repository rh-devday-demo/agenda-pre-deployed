apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenda-pre-deployed
  labels:
    backstage.io/kubernetes-id: agenda-pre-deployed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agenda-pre-deployed
  template:
    metadata:
      labels:
        app: agenda-pre-deployed
        backstage.io/kubernetes-id: agenda-pre-deployed
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agenda
          image: image-registry.openshift-image-registry.svc:5000/agenda-pre-deployed-ci/agenda-pre-deployed:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
