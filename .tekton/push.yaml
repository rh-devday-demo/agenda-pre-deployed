# Pipelines as Code: runs on every push to main in namespace agenda-pre-deployed-ci.
#   fetch -> detect -> test -> build & publish (internal registry) -> tag with the commit SHA
# Until the repository contains an application (package.json + Containerfile) the
# test/build tasks are skipped and the run succeeds with "no application yet".
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: agenda-pre-deployed-on-push
  labels:
    backstage.io/kubernetes-id: agenda-pre-deployed
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: image
      value: image-registry.openshift-image-registry.svc:5000/agenda-pre-deployed-ci/agenda-pre-deployed
  taskRunTemplate:
    serviceAccountName: pipeline
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
  pipelineSpec:
    params:
      - name: repo_url
      - name: revision
      - name: image
    workspaces:
      - name: source
      - name: basic-auth
    results:
      - name: IMAGE_URL
        value: $(tasks.build.results.IMAGE_URL)
      - name: IMAGE_DIGEST
        value: $(tasks.build.results.IMAGE_DIGEST)
    tasks:
      - name: fetch
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: git-clone }
            - { name: namespace, value: openshift-pipelines }
        params:
          - { name: URL, value: $(params.repo_url) }
          - { name: REVISION, value: $(params.revision) }
        workspaces:
          - { name: output, workspace: source }
          - { name: basic-auth, workspace: basic-auth }

      - name: detect
        runAfter: [fetch]
        workspaces:
          - { name: source, workspace: source }
        taskSpec:
          workspaces:
            - name: source
          results:
            - name: has-app
              description: '"true" when package.json and Containerfile exist'
          steps:
            - name: detect
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              workingDir: $(workspaces.source.path)
              script: |
                #!/usr/bin/env sh
                if [ -f package.json ] && [ -f Containerfile ]; then
                  echo "Application found."
                  printf true > "$(results.has-app.path)"
                else
                  echo "No application yet (package.json and Containerfile missing) - skipping test and build."
                  printf false > "$(results.has-app.path)"
                fi

      - name: test
        runAfter: [detect]
        when:
          - { input: $(tasks.detect.results.has-app), operator: in, values: ["true"] }
        workspaces:
          - { name: source, workspace: source }
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: npm-test
              image: registry.access.redhat.com/hi/nodejs:22-builder   # same Red Hat Hardened Image as the Containerfile build stage
              workingDir: $(workspaces.source.path)
              env:
                - { name: npm_config_cache, value: /tmp/.npm }
                - { name: CI, value: "true" }
                - { name: TZ, value: Europe/Vienna }
              script: |
                #!/usr/bin/env bash
                set -euo pipefail
                node --version
                if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
                npm test

      - name: build
        runAfter: [test]
        when:
          - { input: $(tasks.detect.results.has-app), operator: in, values: ["true"] }
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: buildah }
            - { name: namespace, value: openshift-pipelines }
        params:
          - { name: IMAGE, value: "$(params.image):latest" }
          - { name: DOCKERFILE, value: ./Containerfile }
          - { name: CONTEXT, value: . }
        workspaces:
          - { name: source, workspace: source }

      - name: tag-revision
        runAfter: [build]
        when:
          - { input: $(tasks.detect.results.has-app), operator: in, values: ["true"] }
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: openshift-client }
            - { name: namespace, value: openshift-pipelines }
        params:
          - name: SCRIPT
            value: |
              set -e
              IS=agenda-pre-deployed
              oc tag "${IS}@$(tasks.build.results.IMAGE_DIGEST)" "${IS}:$(params.revision)"
              echo "Published $(params.image)@$(tasks.build.results.IMAGE_DIGEST)"
              echo "Tags: latest, $(params.revision)"
